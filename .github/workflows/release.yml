name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -e .

    - name: Build Executable
      run: |
        pyinstaller --name "TRON-DeCypher" --windowed --onefile --add-data "app;app" --add-data "assets;assets" --icon "assets/icon.ico" --noconfirm --clean app/main.py

    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/TRON-DeCypher.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
